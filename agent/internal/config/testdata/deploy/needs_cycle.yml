version: 1
checks:
  jobs:
    test:
      run: pnpm turbo run test
deployments:
  production:
    on: { push: main }
    strategy: script
    run: ./deploy.sh production
    needs: [staging]
  staging:
    on: { push: main }
    strategy: script
    run: ./deploy.sh staging
    needs: [production]
