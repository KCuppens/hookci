# Every section of the format, as a real project would use it.
version: 1
checks:
  on:
    pull_request: true
    push:
      branches: [main, release]
  trust: approve
  forks: never
  limits:
    cpus: 4
    memory: 8G
    tasks: 1024
    timeout: 20m
  setup:
    - run: npm ci
      cache:
        key: [package-lock.json]
        paths: [node_modules]
  jobs:
    lint:
      run: npm run lint
      annotate: eslint
    typecheck:
      run: npx tsc --noEmit
      annotate: tsc
    unit:
      run: npm test
      needs: [lint, typecheck]
      limits:
        memory: 1.5G
      timeout: 5m
  services:
    postgres:
      image: postgres:17-alpine
  egress:
    - registry.npmjs.org
    - github.com
    - api.example.com
deployments:
  production:
    on:
      push: main
      after: checks
    strategy: compose-bluegreen
    paths: ["src/**", "package-lock.json"]
    needs: [staging]
    compose:
      project: app
      file: deploy/compose.yml
      service: web
      shared_network: edge
      marker: /var/lib/zeroci/app.color
    migrate:
      run: ./manage.py migrate
    route:
      kind: caddy
      file: /etc/caddy/routes/app.caddy
      reload: caddy reload --config /etc/caddy/Caddyfile
      upstream_host: 127.0.0.1
    env_file: /etc/zeroci/production.env
    health:
      url: http://127.0.0.1:{port}/health
      expect: 204
      retries: 30
      interval: 1s
    verify:
      window: 2m
      interval: 10s
    retain:
      images: 3
  staging:
    on:
      push: develop
    strategy: script
    run: ./deploy.sh staging
    rollback: ./rollback.sh staging
    health:
      url: http://localhost:8001/healthz
notify:
  slack:
    channel: "#deploys"
    on: [failure, deploy]
    notify: verbose
    alert: dm
redact:
  - "sk_live_[0-9a-zA-Z]{24}"
