version: 1
checks:
  trust: everyone
  limits:
    cpus: 0
    memory: 4GB
    tasks: 8
    timeout: 10
  setup: npm ci
  jobs:
    Build:
      run: make
    test:
      run: go test ./...
      annotate: eslnt
      needs: lint
deployments:
  production:
    on: {push: main, after: deploy}
    strategy: kubernetes
    retain: {images: 1}
    health:
      url: http://127.0.0.1:{port}/
      retries: 0
