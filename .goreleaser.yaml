# Agent releases, cut locally by a maintainer with scripts/release.sh.
# Dry run: goreleaser release --snapshot --clean --skip=sign,publish
version: 2

project_name: hookci

builds:
  - id: hookci
    dir: agent
    main: ./cmd/hookci
    binary: hookci
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/KCuppens/hookci/agent/internal/version.Version={{.Version}}
      - -X github.com/KCuppens/hookci/agent/internal/version.Commit={{.Commit}}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: hookci
    formats: [tar.gz]
    name_template: "hookci_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: packaging/hookci-agent@.service
      - src: packaging/hookci.slice

nfpms:
  - id: hookci
    package_name: hookci
    file_name_template: "hookci_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: HookCI
    homepage: https://github.com/KCuppens/hookci
    maintainer: Kobe Cuppens <kobecuppens@hotmail.com>
    description: HookCI agent, runs CI checks sent by the HookCI hub.
    license: Proprietary
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin
    contents:
      - src: packaging/hookci-agent@.service
        dst: /etc/systemd/system/hookci-agent@.service
        type: config
      - src: packaging/hookci.slice
        dst: /etc/systemd/system/hookci.slice
        type: config
    scripts:
      postinstall: packaging/postinstall.sh

checksum:
  name_template: SHA256SUMS
  algorithm: sha256
  extra_files:
    - glob: agent/internal/selfupdate/trusted_root.json

signs:
  - id: sums
    cmd: cosign
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]
    signature: "${artifact}.sigstore.json"
    artifacts: checksum

release:
  draft: true
  extra_files:
    - glob: agent/internal/selfupdate/trusted_root.json

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"
