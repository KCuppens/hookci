# hookci-hub Worker. Secrets are set with `wrangler secret put` and typed in
# src/env.ts; none belong in this file. Database ids and SLACK_APP_ID are
# placeholders until the Cloudflare resources and Slack Apps are created (M1-29).

name = "hookci-hub"
main = "src/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]
# The hub is served from its own domain; keep the default workers.dev URLs off.
workers_dev = false
preview_urls = false

[vars]
HUB_ORIGIN = "https://ci.webuno.io"
HUB_VERSION = "dev"
# RFC 9116 Expires for /.well-known/security.txt: one year past the build date; bump on each release.
SECURITY_TXT_EXPIRES = "2027-10-20T00:00:00Z"
LATEST_AGENT_VERSION = ""
MIN_AGENT_VERSION = ""
GITHUB_APP_SLUG = "hookci"
SLACK_APP_ID = "A0000000000"
# Email accounts are off unless "true"; see docs/self-hosting.md. ACCOUNTS_MAIL_FROM is the sender address on a domain onboarded to Cloudflare Email Service.
ACCOUNTS_ENABLED = "false"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "hookci-hub"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "LOGS"
bucket_name = "hookci-logs"

[[durable_objects.bindings]]
name = "AGENT_DO"
class_name = "AgentDO"

[[durable_objects.bindings]]
name = "SLACK_DO"
class_name = "SlackWorkspaceDO"

# Sends account mail (verify email, reset password). Used only when ACCOUNTS_ENABLED is "true" and ACCOUNTS_MAIL_FROM is set.
[[send_email]]
name = "EMAIL"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentDO", "SlackWorkspaceDO"]

[triggers]
crons = ["*/5 * * * *"]

[[rules]]
type = "Text"
globs = ["**/*.sh"]
fallthrough = true

[env.staging]
name = "hookci-hub-staging"

[env.staging.vars]
HUB_ORIGIN = "https://ci-staging.webuno.io"
HUB_VERSION = "dev"
SECURITY_TXT_EXPIRES = "2027-10-20T00:00:00Z"
LATEST_AGENT_VERSION = ""
MIN_AGENT_VERSION = ""
GITHUB_APP_SLUG = "hookci-staging"
SLACK_APP_ID = "A0000000001"
# Email accounts are off unless "true"; see docs/self-hosting.md. ACCOUNTS_MAIL_FROM is the sender address on a domain onboarded to Cloudflare Email Service.
ACCOUNTS_ENABLED = "false"

[env.staging.observability]
enabled = true

[[env.staging.d1_databases]]
binding = "DB"
database_name = "hookci-hub-staging"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "LOGS"
bucket_name = "hookci-logs-staging"

[[env.staging.durable_objects.bindings]]
name = "AGENT_DO"
class_name = "AgentDO"

[[env.staging.durable_objects.bindings]]
name = "SLACK_DO"
class_name = "SlackWorkspaceDO"

[[env.staging.send_email]]
name = "EMAIL"
