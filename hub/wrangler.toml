# hookci-hub Worker. Secrets are set with `wrangler secret put` and typed in
# src/env.ts; none belong in this file. The staging database id and both
# SLACK_APP_IDs are placeholders until those resources and Slack Apps exist.

name = "hookci-hub"
main = "src/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat", "enable_request_signal"]
routes = [{ pattern = "ci.hookci.com", custom_domain = true }]

[vars]
HUB_ORIGIN = "https://ci.hookci.com"
HUB_VERSION = "dev"
# security.txt Contact (mailto: or https:).
SECURITY_CONTACT = "mailto:security@hookci.com"
LATEST_AGENT_VERSION = ""
MIN_AGENT_VERSION = ""
GITHUB_APP_SLUG = "hookci"
HUB_MODE = "shared"
SLACK_APP_ID = "A0000000000"
TELEGRAM_API_BASE = "https://api.telegram.org"
LINEAR_API_URL = "https://api.linear.app/graphql"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "hookci-hub"
database_id = "cc2a0a92-85fc-4d62-9686-a3b8f6b2719c"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "LOGS"
bucket_name = "hookci-logs"

[[durable_objects.bindings]]
name = "AGENT_DO"
class_name = "AgentDO"

[[durable_objects.bindings]]
name = "SLACK_DO"
class_name = "SlackWorkspaceDO"

[[durable_objects.bindings]]
name = "SINK_OUTBOX"
class_name = "SinkOutboxDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentDO", "SlackWorkspaceDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SinkOutboxDO"]

[triggers]
crons = ["*/5 * * * *", "17 3 * * *"]

[[rules]]
type = "Text"
globs = ["**/*.sh", "**/*.css", "**/*viewer.js"]
fallthrough = true

[env.staging]
name = "hookci-hub-staging"

[env.staging.vars]
HUB_ORIGIN = "https://ci-staging.hookci.com"
HUB_VERSION = "dev"
SECURITY_CONTACT = "mailto:security@hookci.com"
LATEST_AGENT_VERSION = ""
MIN_AGENT_VERSION = ""
GITHUB_APP_SLUG = "hookci-staging"
HUB_MODE = "shared"
SLACK_APP_ID = "A0000000001"
TELEGRAM_API_BASE = "https://api.telegram.org"
LINEAR_API_URL = "https://api.linear.app/graphql"

[env.staging.observability]
enabled = true

[[env.staging.d1_databases]]
binding = "DB"
database_name = "hookci-hub-staging"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "LOGS"
bucket_name = "hookci-logs-staging"

[[env.staging.durable_objects.bindings]]
name = "AGENT_DO"
class_name = "AgentDO"

[[env.staging.durable_objects.bindings]]
name = "SLACK_DO"
class_name = "SlackWorkspaceDO"

[[env.staging.durable_objects.bindings]]
name = "SINK_OUTBOX"
class_name = "SinkOutboxDO"
