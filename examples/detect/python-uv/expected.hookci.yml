# python: uv (uv.lock)
# python: setup installs ruff pytest for the detected jobs

version: 1
checks:
  setup:
    - run: uv sync --frozen && uv pip install ruff pytest
      cache:
        key: [uv.lock]
        paths: [.venv]
  jobs:
    pytest:
      run: uv run pytest
    ruff:
      run: uv run ruff check .
