# package manager: pnpm (pnpm-lock.yaml)
# node 20 (from .nvmrc), not installed by hookci
# turbo runs as pnpm exec turbo, so turbo must be a devDependency

version: 1
checks:
  setup:
    - run: pnpm install --frozen-lockfile
      cache:
        key: [pnpm-lock.yaml]
        paths: [apps/*/node_modules, node_modules, packages/*/node_modules]
  jobs:
    lint:
      run: sh -c 'pnpm exec turbo run lint ${HOOKCI_BASE_SHA:+--filter=...[$HOOKCI_BASE_SHA]}'
      annotate: eslint
    typecheck:
      run: sh -c 'pnpm exec turbo run typecheck ${HOOKCI_BASE_SHA:+--filter=...[$HOOKCI_BASE_SHA]}'
      annotate: tsc
    unit:
      run: sh -c 'pnpm exec turbo run test:unit ${HOOKCI_BASE_SHA:+--filter=...[$HOOKCI_BASE_SHA]}'
