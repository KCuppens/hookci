# package manager: yarn (yarn.lock)

version: 1
checks:
  setup:
    - run: yarn install --immutable
      cache:
        key: [yarn.lock]
        paths: [node_modules, packages/core/node_modules]
  jobs:
    lint:
      run: yarn run lint
      annotate: eslint
    test:
      run: yarn run test
    typecheck:
      run: yarn run typecheck
      annotate: tsc
